[project]
name = "ocr-engine-core"
version = "0.1.0"
description = "FIBA scoresheet OCR core engine"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "Pillow>=11.0",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_engine_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/ocr_engine_core/resources/schemas" = "ocr_engine_core/resources/schemas"
