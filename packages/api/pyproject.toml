[project]
name = "ocr-engine-api"
version = "0.1.0"
description = "FastAPI adapter for the FIBA OCR engine"
requires-python = ">=3.12"
dependencies = [
    "ocr-engine-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "supabase>=2.0",
    "pyjwt>=2.0",
]

[project.scripts]
ocr-api = "ocr_engine_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_engine_api"]
