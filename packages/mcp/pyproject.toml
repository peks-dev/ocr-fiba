[project]
name = "ocr-engine-mcp"
version = "0.1.0"
description = "MCP server adapter for the FIBA OCR engine API"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.2.4",
    "requests>=2.32",
]

[project.scripts]
ocr-mcp = "ocr_engine_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_engine_mcp"]
