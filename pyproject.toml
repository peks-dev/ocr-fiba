requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastmcp==3.2.4",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "Pillow>=11.0",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "uvicorn>=0.30",
]
